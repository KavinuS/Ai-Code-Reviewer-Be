# Render blueprint for the AI Code Review Assistant backend.
#
#   Render dashboard -> New -> Blueprint -> this repository
#
# Everything below is created from this file; only the two `sync: false`
# variables at the end are typed into the dashboard by hand, because they are
# secrets and this file is committed.
#
# Region matters. The database's internal url resolves only inside Render's
# network and only within one region, so the service has to sit in the same
# region as the database it talks to. This one is Oregon.

services:
  - type: web
    name: ai-code-reviewer-api
    runtime: python
    plan: free
    region: oregon
    # The Angular bundle hard-codes https://ai-code-reviewer-api.onrender.com
    # in frontend/src/environments/environment.ts. Renaming this service
    # changes that hostname, so the two have to be changed together.

    # migrate runs here rather than as a pre-deploy step, which is a paid
    # feature. The consequence is that it runs while the previous version is
    # still serving traffic: a migration the old code cannot survive will take
    # the running service down before the new one replaces it.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input

    # --timeout must clear the AI call. A review measured 40-82 seconds and
    # gunicorn's default is 30, which would kill the worker mid-review and
    # return an empty response. Two workers is what the free plan's 512 MB
    # holds comfortably; each is single-threaded, so this serves two concurrent
    # reviews and queues the rest.
    startCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --timeout 240
      --access-logfile -

    # Returns 503 when the database or cache is unreachable, so a deploy that
    # cannot reach its database is rolled back rather than served.
    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"

      # Turning this on would expose tracebacks - including the database
      # password - on any error page.
      - key: DJANGO_DEBUG
        value: "false"

      # Generated by Render on first deploy and then held. Rotating it signs
      # everybody out: it also signs the JWTs.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # RENDER_EXTERNAL_HOSTNAME is appended to ALLOWED_HOSTS by settings.py,
      # so the public hostname needs no entry here. These two cover a request
      # that arrives without it, such as an internal health probe.
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1

      # The browser origin the Angular bundle is served from. A missing entry
      # here is not a server error - the API answers normally and the browser
      # discards the response, which the frontend reports as a network failure
      # with status 0, reading like the server being down.
      - key: CORS_ALLOWED_ORIGINS
        value: https://kavinus.github.io

      - key: ENVIRONMENT_NAME
        value: production
      - key: SERVICE_VERSION
        value: "0.1.0"
      - key: LOG_LEVEL
        value: INFO

      # OAuth hops between these two origins. Both must match, character for
      # character, what is registered in the GitHub and Google consoles - the
      # provider refuses a mismatch on its own error page, before the request
      # ever reaches this service.
      - key: OAUTH_CALLBACK_BASE_URL
        value: https://ai-code-reviewer-api.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://kavinus.github.io

      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "180"

      # ---- Set by hand in the dashboard (never committed) ----------------
      #
      # DATABASE_URL: the INTERNAL url of the Render Postgres instance
      #   (dpg-xxxx-a, no domain). The external url also works but leaves
      #   Render's network on every query. Same region as this service.
      #
      # GEMINI_API_KEY: https://aistudio.google.com/apikey
      #
      # Optional - each provider is offered to the browser only when both of
      # its values are present, so leaving a pair empty simply hides that
      # sign-in button.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

# The database is deliberately NOT declared here.
#
# It already exists in this account, holds the data, and Render's free tier
# allows one Postgres instance at a time - so declaring one would either fail
# to create or create a second, empty database and quietly point the service at
# it. DATABASE_URL above is what joins the two.
#
# If that free instance expires (free Postgres is deleted 30 days after it is
# created) uncomment the block below and drop the `sync: false` DATABASE_URL
# entry above in favour of the fromDatabase one, and Render will create and
# wire the replacement itself:
#
# databases:
#   - name: ai-code-review-db
#     databaseName: ai_code_review
#     user: ai_code_review
#     plan: free
#     region: oregon
#
#       - key: DATABASE_URL
#         fromDatabase:
#           name: ai-code-review-db
#           property: connectionString
